<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registrering</title>
</head>
<body>
    <h1>Registrering</h1>
    <form method="POST">
        <label for="navn">Navn:</label>
        <input type="text" id="navn" name="navn" required><br><br>
        
        <label for="fag">Fag:</label>
        <input type="text" id="fag" name="fag" required><br><br>
        
        <label for="epost">E-post:</label>
        <input type="email" id="epost" name="epost" required><br><br>
        
        <label for="alder">Alder:</label>
        <input type="number" id="alder" name="alder" required><br><br>
        
       <label for="kommentar">Kommentar:</label>
        <input type="text" id="kommentar" name="kommentar"><br><br>
        
        <button type="submit">Send</button>
    </form>
</body>
</html>
